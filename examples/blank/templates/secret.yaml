apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
stringData:
  # A subchart's values, supplied by the subchart. Correct, and must not be
  # reported.
  password: {{ .Values.postgresql.auth.password | quote }}
  # Guarded properly: a missing value fails the render instead of rendering
  # blank.
  token: {{ required "apiToken is required" .Values.apiToken | quote }}
  # Also fine — an explicit fallback.
  region: {{ .Values.region | default "eu-west-1" }}
