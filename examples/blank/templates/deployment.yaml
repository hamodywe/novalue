apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  template:
    spec:
      containers:
        - name: app
          # `.Values.image.tag` is defined nowhere. This renders as `myapp:`.
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            # Also undefined, and unguarded.
            - name: API_URL
              value: {{ .Values.apiUrl }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
