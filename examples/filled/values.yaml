replicaCount: 2

image:
  repository: myapp
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  port: 80

# A real default rather than a null, so an install that does not override it
# still renders a working Ingress rule.
ingressHost: app.example.com

apiUrl: https://api.example.com

resources:
  limits:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10

ingress:
  enabled: true
  className: nginx
