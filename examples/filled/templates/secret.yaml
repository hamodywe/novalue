apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-db
stringData:
  # The subchart supplies its own values.
  password: {{ .Values.postgresql.auth.password | quote }}
  # Required, so an unset install fails the render rather than deploying blank.
  token: {{ required "apiToken is required" .Values.apiToken | quote }}
  # Optional, with an explicit fallback.
  region: {{ .Values.region | default "eu-west-1" }}
